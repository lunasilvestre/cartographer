name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: servers/eo-mcp

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create venv on Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install
        run: uv pip install -e '.[dev]'

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Unit tests
        # Integration tests hit a live external backend, so they are excluded
        # from CI — a backend outage must not turn the build red.
        env:
          EO_MCP_SKIP_INTEGRATION: "1"
        run: uv run pytest -m "not slow" -q

  smoke:
    name: clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv
        run: uv venv --python 3.13

      - name: Install from a clean tree (non-editable)
        run: uv pip install .

      - name: Server builds and registers exactly the 11 documented tools
        run: |
          uv run python - <<'PY'
          import asyncio
          from eo_mcp.server import build_server

          EXPECTED = {
              "get_raster_info", "get_tile_url", "get_zonal_statistics",
              "list_vector_collections", "get_vector_features", "get_vector_feature",
              "get_vector_tile_url", "get_collection_queryables",
              "flood_rainfall_analysis", "multi_layer_summary", "collection_health_check",
          }

          tools = {t.name for t in asyncio.run(build_server().list_tools())}
          assert not (EXPECTED - tools), f"missing: {sorted(EXPECTED - tools)}"
          assert not (tools - EXPECTED), f"unexpected: {sorted(tools - EXPECTED)}"
          print(f"OK - {len(tools)} tools registered")
          PY

      - name: Console script is installed
        run: uv run eo-mcp --help || true
