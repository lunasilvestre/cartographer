[project]
name = "eo-mcp"
version = "0.1.0"
description = "MCP server for cloud-native EO raster analysis (TiTiler), vector queries (tipg), and geospatial workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nelson Luna Silvestre", email = "lunasilvestre@gmail.com" }]
keywords = ["mcp", "geospatial", "earth-observation", "stac", "titiler", "tipg", "raster", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    # fastmcp 3.x only: the 2.x server API is incompatible (tool results moved
    # from list[Content] to ToolResult, and fastmcp.exceptions was restructured).
    "fastmcp>=3.4.6,<4",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/lunasilvestre/cartographer"
Repository = "https://github.com/lunasilvestre/cartographer"
Issues = "https://github.com/lunasilvestre/cartographer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Pinned to a minor range: ruff's default rule set widens between releases,
    # so an unpinned linter turns CI red on a ruff release rather than a code
    # change. The explicit [tool.ruff.lint] select below makes this deterministic
    # regardless, but the pin keeps autofix behaviour stable too.
    "ruff>=0.16.2,<0.17",
    "coverage>=7.15.4",
]

[project.scripts]
eo-mcp = "eo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that hit live endpoints",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults, which widen
# between releases.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Long, deliberately verbose tool docstrings are the LLM-facing contract for
# each tool; wrapping them hurts readability more than it helps.
"src/eo_mcp/tools/*.py" = ["E501"]
# E501: test fixtures are wide literal payloads (GeoJSON, TileJSON) — wrapping
#   them obscures the shape of the data being asserted against.
# SIM108: the suggested ternaries exceed the line limit and read worse than the
#   if/else they replace.
"tests/*.py" = ["E501", "SIM108"]

[tool.coverage.run]
source = ["src/eo_mcp"]
# Branch coverage as well as line coverage: this package is mostly parameter
# validation and request shaping, where the interesting bugs live in the
# untaken branch of a conditional rather than in an unexecuted line.
branch = true

[tool.coverage.report]
show_missing = true
# Measured 99% (statement and branch). The remaining partials are guards that
# are correct but unreachable from a test — notably the second check in the
# double-checked lock in HttpBackend.client(), which an uncontended asyncio.Lock
# never exercises. Those are worth keeping uncovered rather than deleting.
#
# The floor sits just below the measurement, sized by what it tolerates: at 649
# statements, each point is ~6.5 statements, so 97 allows roughly a dozen
# uncovered — a couple of defensive branches — where 95 would quietly absorb a
# whole tool's error paths.
#
# 97 rather than something slacker because the headroom is demonstrated, not
# assumed: the package grew 536 -> 649 statements in a day and coverage stayed
# at 99% throughout. Growth here has not eroded coverage. Do not raise it above
# 97 — that starts failing the build on correct-but-untestable guards, such as
# the second check in the double-checked lock in HttpBackend.client(), which an
# uncontended asyncio.Lock never exercises.
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]
